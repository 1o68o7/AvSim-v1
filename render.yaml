# Blueprint Render — API FastAPI + frontend Vite (statique).
# Dashboard → New → Blueprint → connecter le repo GitHub ; Render lit ce fichier.
# Aucun secret dans le dépôt : Render les demande à la connexion du compte.

services:
  # --- API (Python / FastAPI) -----------------------------------------------
  - type: web
    name: avsim-api
    runtime: python
    plan: free
    buildCommand: pip install -e '.[api]'
    startCommand: uvicorn avsim.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # EventStore SQLite (défaut data/avsim_events.sqlite).
      # ATTENTION Render Free : filesystem éphémère — SQLite perdu à chaque
      # redeploy / restart / spin-down idle (15 min). Pas de persistent disk
      # sur Free (doc Render). Persistance process-local seulement ici.
      - key: AVSIM_EVENTS_DB
        value: data/avsim_events.sqlite

  # --- Frontend (Vite → site statique) --------------------------------------
  - type: web
    name: avsim-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Bake au build — après le 1er deploy, redeploy le static si l'URL API change.
      - key: VITE_API_URL
        fromService:
          name: avsim-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: "22"
