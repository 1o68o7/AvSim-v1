<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-cockpit": "#0B0E12",
            "surface-panel": "#111418",
            "surface-sub": "#181C21",
            "border-hairline": "#2A2F36",
            "primary-amber": "#E8C547",
            "label-muted": "#9AA0A6",
            "port-red": "#E05353",
            "starboard-green": "#46C275"
          },
          fontFamily: {
            mono: ["'JetBrains Mono'", "monospace"]
          }
        }
      }
    };
  </script>
<style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B0E12;
      font-family: 'JetBrains Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }
    .horizon-grid line {
      stroke: #2A2F36;
      stroke-dasharray: 2 3;
    }
  </style>
</head>
<body class="w-full h-full flex items-center justify-center bg-[#0B0E12] text-white">
<!-- Fixed 844x390 Landscape Cockpit Frame -->
<div class="w-[844px] h-[390px] max-w-[844px] max-h-[390px] grid grid-cols-12 bg-[#0B0E12] border border-[#2A2F36] overflow-hidden">
<!-- ==================== COLONNE GAUCHE (~42% -> col-span-5) ==================== -->
<div class="col-span-5 flex flex-col border-r border-[#2A2F36] bg-[#0B0E12]">
<!-- Ligne 1 : Cadence -->
<div class="flex-1 p-3.5 flex flex-col justify-between border-b border-[#2A2F36]">
<div class="flex items-center justify-between">
<span class="text-[11px] font-bold tracking-widest text-[#9AA0A6] uppercase">CADENCE</span>
<span class="text-[10px] font-bold tracking-wider px-2 py-0.5 border border-[#2A2F36] text-[#E8C547] bg-[#111418]">
            COUPS/MIN
          </span>
</div>
<div class="flex items-baseline justify-between">
<span class="text-[64px] font-extrabold text-white leading-none tracking-tight tabular-nums">28</span>
<span class="text-[14px] font-bold text-[#9AA0A6] tracking-widest uppercase">SPM</span>
</div>
</div>
<!-- Ligne 2 : Vitesse sol (strictement sans le 1:59 pour éviter tout chevauchement) -->
<div class="flex-1 p-3.5 flex flex-col justify-between border-b border-[#2A2F36]">
<div class="flex items-center justify-between">
<span class="text-[11px] font-bold tracking-widest text-[#9AA0A6] uppercase">VITESSE SOL</span>
<span class="text-[10px] font-bold text-[#E8C547] uppercase tracking-wider">SOG 10HZ</span>
</div>
<div class="flex items-baseline justify-between">
<span class="text-[52px] font-extrabold text-white leading-none tracking-tight tabular-nums">4.2</span>
<span class="text-[14px] font-bold text-[#E8C547] tracking-wider uppercase">M/S</span>
</div>
<div class="text-[10px] font-semibold text-[#9AA0A6] uppercase tracking-widest flex items-center gap-1.5">
<span class="w-1.5 h-1.5 bg-[#E8C547] inline-block"></span>
          SOL — PAS EAU
        </div>
</div>
<!-- Ligne 3 : Distance & Identifiant -->
<div class="h-[74px] p-3.5 flex items-center justify-between bg-[#111418]">
<div>
<span class="block text-[10px] font-bold text-[#9AA0A6] uppercase tracking-widest">DISTANCE</span>
<span class="text-[10px] font-semibold text-[#E8C547] uppercase tracking-wider">SKF·1X // LIVE</span>
</div>
<div class="flex items-baseline gap-1.5">
<span class="text-[28px] font-extrabold text-white leading-none tabular-nums">1.24</span>
<span class="text-[12px] font-bold text-[#9AA0A6] uppercase tracking-wider">KM</span>
</div>
</div>
</div>
<!-- ==================== COLONNE CENTRALE (~38% -> col-span-5) ==================== -->
<div class="col-span-5 flex flex-col border-r border-[#2A2F36] bg-[#0B0E12] justify-between">
<!-- En-tête Gîte : STRICTEMENT sur 1 seule ligne -->
<div class="px-3.5 py-2.5 border-b border-[#2A2F36] flex items-center justify-between bg-[#111418]">
<div class="flex items-center gap-2">
<span class="text-[12px] font-bold tracking-widest text-white uppercase">GÎTE</span>
<span class="text-[10px] text-[#9AA0A6] tracking-wider font-semibold">TOLÉRANCE ±3.0°</span>
</div>
<div class="flex items-center gap-2.5">
<span class="flex items-center gap-1 text-[10px] font-bold text-[#9AA0A6]">
<span class="w-1.5 h-1.5 bg-[#E05353] inline-block"></span> BÂBORD
          </span>
<span class="text-[#2A2F36] font-bold">|</span>
<span class="flex items-center gap-1 text-[10px] font-bold text-[#9AA0A6]">
<span class="w-1.5 h-1.5 bg-[#46C275] inline-block"></span> TRIBORD
          </span>
</div>
</div>
<!-- Cadran Horizon Nautique / Heel Gauge Flat -->
<div class="relative flex-1 flex items-center justify-center px-2 overflow-hidden bg-[#0B0E12]">
<svg class="w-full h-full max-h-[220px]" viewbox="0 0 320 200">
<!-- Graticule & Ligne d'horizon de référence -->
<line stroke="#2A2F36" stroke-width="1.5" x1="20" x2="300" y1="100" y2="100"></line>
<line stroke="#2A2F36" stroke-dasharray="2 3" stroke-width="1" x1="160" x2="160" y1="15" y2="185"></line>
<!-- Zone de tolérance neutre ±3.0° -->
<polygon fill="#E8C547" fill-opacity="0.06" points="144,30 176,30 186,170 134,170" stroke="#E8C547" stroke-dasharray="2 2" stroke-width="0.75"></polygon>
<!-- Repères d'angles sur arc -->
<path d="M 60,65 A 130 130 0 0 1 260,65" fill="none" stroke="#2A2F36" stroke-width="1.5"></path>
<!-- Repère 0° vertical -->
<line stroke="#FFFFFF" stroke-width="2" x1="160" x2="160" y1="28" y2="40"></line>
<text fill="#FFFFFF" font-family="JetBrains Mono" font-size="9" font-weight="700" text-anchor="middle" x="160" y="24">0°</text>
<!-- Bâbord ticks: -3°, -10°, -20° -->
<line stroke="#E05353" stroke-width="1.5" x1="145" x2="147" y1="31" y2="39"></line>
<line stroke="#9AA0A6" stroke-width="1.5" x1="110" x2="114" y1="42" y2="50"></line>
<text fill="#9AA0A6" font-family="JetBrains Mono" font-size="8" font-weight="600" text-anchor="middle" x="104" y="38">-10°</text>
<line stroke="#9AA0A6" stroke-width="1.5" x1="60" x2="68" y1="65" y2="72"></line>
<text fill="#9AA0A6" font-family="JetBrains Mono" font-size="8" font-weight="600" text-anchor="middle" x="50" y="63">-20°</text>
<!-- Tribord ticks: +3°, +10°, +20° -->
<line stroke="#46C275" stroke-width="1.5" x1="175" x2="173" y1="31" y2="39"></line>
<line stroke="#9AA0A6" stroke-width="1.5" x1="210" x2="206" y1="42" y2="50"></line>
<text fill="#9AA0A6" font-family="JetBrains Mono" font-size="8" font-weight="600" text-anchor="middle" x="216" y="38">+10°</text>
<line stroke="#9AA0A6" stroke-width="1.5" x1="260" x2="252" y1="65" y2="72"></line>
<text fill="#9AA0A6" font-family="JetBrains Mono" font-size="8" font-weight="600" text-anchor="middle" x="270" y="63">+20°</text>
<!-- Aiguille & repère bateau incliné à +1.4° (Tribord) -->
<g transform="rotate(1.4 160 100)">
<!-- Barre d'assiette dynamique -->
<line stroke="#E8C547" stroke-width="2.5" x1="45" x2="275" y1="100" y2="100"></line>
<circle cx="45" cy="100" fill="#E8C547" r="2.5"></circle>
<circle cx="275" cy="100" fill="#E8C547" r="2.5"></circle>
<!-- Flèche/Pointeur central supérieur -->
<polygon fill="#E8C547" points="160,54 156,72 164,72"></polygon>
<line stroke="#E8C547" stroke-width="2" x1="160" x2="160" y1="72" y2="100"></line>
</g>
<!-- Réticule fixe central Skiff (Invariable au cockpit) -->
<rect fill="#0B0E12" height="6" stroke="#FFFFFF" stroke-width="1.5" width="6" x="157" y="97"></rect>
<line stroke="#FFFFFF" stroke-width="1.5" x1="140" x2="152" y1="100" y2="100"></line>
<line stroke="#FFFFFF" stroke-width="1.5" x1="168" x2="180" y1="100" y2="100"></line>
</svg>
<!-- Statut d'assiette textuel discret -->
<span class="absolute bottom-2.5 left-3 text-[10px] font-bold text-[#9AA0A6] tracking-wider uppercase">STABLE</span>
<span class="absolute bottom-2.5 right-3 text-[10px] font-bold text-[#46C275] tracking-wider uppercase">DANS CIBLE</span>
</div>
<!-- Bas de colonne : Valeur numérique nette "+1.4° TRIBORD" sans déborder -->
<div class="h-[74px] px-3.5 flex items-center justify-between border-t border-[#2A2F36] bg-[#111418]">
<div>
<span class="block text-[10px] font-bold text-[#9AA0A6] uppercase tracking-widest">ÉCART GÎTE</span>
<span class="text-[10px] font-bold text-[#46C275] uppercase tracking-wider">TRIBORD (+1.4°)</span>
</div>
<div class="flex items-baseline gap-1">
<span class="text-[34px] font-extrabold text-white leading-none tabular-nums">+1.4°</span>
</div>
</div>
</div>
<!-- ==================== COLONNE DROITE (~20% -> col-span-2) ==================== -->
<div class="col-span-2 flex flex-col justify-between p-3 bg-[#0B0E12]">
<!-- Indicateurs système et état des capteurs -->
<div class="flex flex-col gap-2">
<div class="text-[10px] font-bold text-[#9AA0A6] uppercase tracking-widest border-b border-[#2A2F36] pb-1.5">
          SYSTÈME
        </div>
<!-- Pilule GPS -->
<div class="h-8 px-2 flex items-center justify-between border border-[#2A2F36] bg-[#111418]">
<span class="text-[11px] font-bold text-white uppercase tracking-wider">GPS</span>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-none bg-[#46C275]"></span>
<span class="text-[9px] font-bold text-[#9AA0A6]">FIX</span>
</div>
</div>
<!-- Pilule IMU -->
<div class="h-8 px-2 flex items-center justify-between border border-[#2A2F36] bg-[#111418]">
<span class="text-[11px] font-bold text-white uppercase tracking-wider">IMU</span>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-none bg-[#46C275]"></span>
<span class="text-[9px] font-bold text-[#9AA0A6]">CAL</span>
</div>
</div>
<!-- Connectivité 4G -->
<div class="h-8 px-2 flex items-center justify-between border border-[#2A2F36] bg-[#111418]">
<span class="text-[11px] font-bold text-white uppercase tracking-wider">4G</span>
<div class="flex items-end gap-[2px] h-3">
<span class="w-1 h-1.5 bg-[#E8C547]"></span>
<span class="w-1 h-2.5 bg-[#E8C547]"></span>
<span class="w-1 h-3 bg-[#E8C547]"></span>
<span class="w-1 h-3 bg-[#2A2F36]"></span>
</div>
</div>
<!-- Batterie iPhone -->
<div class="h-8 px-2 flex items-center justify-between border border-[#2A2F36] bg-[#111418]">
<div class="flex items-center gap-1">
<div class="w-4 h-2.5 border border-[#9AA0A6] p-[1px] relative flex items-center">
<div class="h-full w-[62%] bg-[#E8C547]"></div>
<div class="absolute -right-[3px] top-0.5 w-[2px] h-1.5 bg-[#9AA0A6]"></div>
</div>
</div>
<span class="text-[11px] font-bold text-white tabular-nums">62%</span>
</div>
</div>
<!-- Bouton STOP strict rectangulaire à confirmation -->
<div class="mt-auto">
<button class="w-full h-14 border-2 border-[#E05353] bg-[#111418] text-[#E05353] hover:bg-[#E05353]/10 active:bg-[#E05353] active:text-white transition-none flex flex-col items-center justify-center focus:outline-none" id="btn-stop">
<span class="text-[14px] font-extrabold tracking-widest uppercase" id="btn-stop-text">STOP</span>
<span class="text-[9px] font-bold tracking-wider text-[#9AA0A6] uppercase mt-0.5" id="btn-stop-hint">TOUCHER 2X</span>
</button>
</div>
</div>
</div>
<script>
    (function() {
      const stopBtn = document.getElementById('btn-stop');
      const stopText = document.getElementById('btn-stop-text');
      const stopHint = document.getElementById('btn-stop-hint');
      let confirmActive = false;
      let timeoutHandle = null;

      stopBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (!confirmActive) {
          confirmActive = true;
          stopBtn.classList.remove('bg-[#111418]', 'text-[#E05353]');
          stopBtn.classList.add('bg-[#E05353]', 'text-white');
          stopText.textContent = 'CONFIRMER';
          stopHint.textContent = 'ANNULER (3S)';
          stopHint.classList.remove('text-[#9AA0A6]');
          stopHint.classList.add('text-white');

          timeoutHandle = setTimeout(resetState, 3000);
        } else {
          clearTimeout(timeoutHandle);
          stopText.textContent = 'ARRÊTÉ';
          stopHint.textContent = 'ENREGISTRÉ';
          stopBtn.disabled = true;
          stopBtn.classList.add('opacity-50');
        }
      });

      function resetState() {
        confirmActive = false;
        stopBtn.classList.remove('bg-[#E05353]', 'text-white');
        stopBtn.classList.add('bg-[#111418]', 'text-[#E05353]');
        stopText.textContent = 'STOP';
        stopHint.textContent = 'TOUCHER 2X';
        stopHint.classList.remove('text-white');
        stopHint.classList.add('text-[#9AA0A6]');
      }
    })();
  </script>
</body></html>
