<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cockpit Rameur Alerte - DR-52</title>
<!-- Tailwind CSS CDN v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            telemetry: {
              bg: '#0A0E17',
              panel: '#0F1522',
              card: '#131B26',
              border: '#1E293B',
              borderLight: '#334155',
              volt: '#00E676',
              voltDark: '#00B050',
              textMuted: '#64748B',
              textDim: '#94A3B8'
            }
          },
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
<style data-purpose="base-layout">
    body {
      margin: 0;
      padding: 0;
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Fixed rigid viewport dimensions per specification */
    .cockpit-viewport {
      width: 956px;
      height: 440px;
      position: relative;
      background-color: #0A0E17;
      overflow: hidden;
      border: 1px solid #1E293B;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
  </style>
<style data-purpose="inclinometer-svg">
    /* Subtle glow for the alert states */
    .glow-volt {
      filter: drop-shadow(0 0 6px rgba(0, 230, 118, 0.45));
    }
  </style>
</head>
<body>
<!-- BEGIN: CockpitDisplayContainer -->
<main class="cockpit-viewport flex flex-col" data-purpose="rowing-telemetry-screen">
<!-- BEGIN: AlertBanner -->
<!-- Full-width bright volt alert header banner -->
<header class="w-full h-[38px] min-h-[38px] bg-[#00E676] flex items-center justify-center px-4 tracking-widest text-black font-black text-[14.5px] uppercase select-none shadow-md z-20" data-purpose="top-alert-banner">
<span class="flex items-center gap-2 tracking-[0.25em]">
<svg class="w-4 h-4 fill-black" viewbox="0 0 24 24">
<path d="M12 4L2 20h20L12 4z"></path>
</svg>
        GÎTE — TROP TRIBORD
      </span>
</header>
<!-- END: AlertBanner -->
<!-- BEGIN: MainInstrumentBody -->
<!-- 3-Column main metrics instrumentation body (Total height: 402px) -->
<section class="w-full h-[402px] grid grid-cols-[295px_431px_230px] divide-x divide-telemetry-border" data-purpose="telemetry-grid">
<!-- ========================================== -->
<!-- COLUMN 1: STROKE & SPEED METRICS (LEFT)    -->
<!-- ========================================== -->
<!-- BEGIN: LeftMetricsColumn -->
<div class="flex flex-col h-full bg-[#0A0E17]/60 px-6 py-4 justify-between" data-purpose="stroke-metrics-column">
<!-- Metric 1: Stroke cadence -->
<div class="flex items-baseline justify-between pt-1" data-purpose="metric-stroke-rate">
<div class="flex items-baseline gap-3">
<span class="text-[56px] leading-none font-black tracking-tight text-white font-sans">27</span>
<span class="text-[13px] font-bold tracking-wider text-telemetry-textDim uppercase">COUPS/MIN</span>
</div>
</div>
<div class="w-full border-t border-telemetry-border"></div>
<!-- Metric 2: Speed / Velocity -->
<div class="flex flex-col justify-center py-1" data-purpose="metric-velocity">
<div class="flex items-baseline gap-2">
<span class="text-[56px] leading-none font-black tracking-tight text-white font-sans">3.9</span>
<span class="text-[17px] font-bold tracking-normal text-white">m/s</span>
</div>
<span class="text-[12px] font-mono tracking-tight text-telemetry-textMuted mt-1">sol — pas eau</span>
</div>
<div class="w-full border-t border-telemetry-border"></div>
<!-- Metric 3: Distance & Boat classification -->
<div class="flex items-end justify-between pb-1" data-purpose="metric-distance-profile">
<div class="flex items-baseline gap-2">
<span class="text-[52px] leading-none font-black tracking-tight text-white font-sans">1.38</span>
<span class="text-[15px] font-bold tracking-wider text-telemetry-textDim uppercase">KM</span>
</div>
<div class="text-[11px] font-mono font-medium tracking-wider text-telemetry-textMuted pb-1">
            SKF·1X // LIVE
          </div>
</div>
</div>
<!-- END: LeftMetricsColumn -->
<!-- ========================================== -->
<!-- COLUMN 2: INCLINOMETER / GÎTE (CENTER)     -->
<!-- ========================================== -->
<!-- BEGIN: CenterInclinometerColumn -->
<div class="flex flex-col h-full bg-[#0B0F19] px-6 py-3.5 justify-between relative" data-purpose="inclinometer-column">
<!-- Header: Metric title and tolerance parameters -->
<div class="w-full flex items-center justify-between text-telemetry-textDim text-[12px] font-mono uppercase tracking-widest pt-1">
<span class="font-bold text-white text-[13px]">GÎTE</span>
<span>TOLÉRANCE ±3.0°</span>
</div>
<!-- Central Vector Instrument: Inclinometer Gauge -->
<div class="w-full flex-1 flex flex-col items-center justify-center relative my-1" data-purpose="heel-gauge-display">
<svg class="w-[380px] h-[195px] overflow-visible" viewbox="0 0 380 195">
<!-- Background Arc and Tolerance Band -->
<defs>
<filter height="140%" id="needle-shadow" width="140%" x="-20%" y="-20%">
<fedropshadow dx="0" dy="2" flood-color="#000" flood-opacity="0.8" stddeviation="3"></fedropshadow>
</filter>
</defs>
<!-- Base Reference Arc (Dashed) -->
<path d="M 60 120 A 130 130 0 0 1 320 120" fill="none" stroke="#1E293B" stroke-dasharray="4 4" stroke-width="2.5"></path>
<!-- Green Safe Tolerance Zone Center Arc (-3° to +3°) -->
<path class="glow-volt" d="M 166 22 A 130 130 0 0 1 214 22" fill="none" stroke="#00E676" stroke-linecap="round" stroke-width="5"></path>
<!-- Graduation labels & marks -->
<!-- 10 Deg Babord Mark -->
<line stroke="#475569" stroke-width="2" x1="90" x2="98" y1="58" y2="70"></line>
<text fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle" x="76" y="58">10</text>
<!-- 0 Deg Zenith Mark -->
<line stroke="#E2E8F0" stroke-width="2.5" x1="190" x2="190" y1="18" y2="30"></line>
<text fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" x="190" y="11">0°</text>
<!-- 10 Deg Tribord Mark -->
<line stroke="#475569" stroke-width="2" x1="290" x2="282" y1="58" y2="70"></line>
<text fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle" x="304" y="58">10</text>
<!-- Subtly tilted Boat Horizon Crossbar (Rotated +4.8 deg matching tilt) -->
<!-- Pivot at (190, 120) -->
<g transform="rotate(4.8, 190, 120)">
<!-- Horizon Bar Left (White/Thick) -->
<line stroke="#FFFFFF" stroke-linecap="round" stroke-width="3.5" x1="30" x2="162" y1="120" y2="120"></line>
<!-- Horizon Bar Right (White/Thick) -->
<line stroke="#FFFFFF" stroke-linecap="round" stroke-width="3.5" x1="218" x2="350" y1="120" y2="120"></line>
<!-- Dash references extending further -->
<line stroke="#334155" stroke-linecap="round" stroke-width="2" x1="5" x2="20" y1="120" y2="120"></line>
<line stroke="#334155" stroke-linecap="round" stroke-width="2" x1="360" x2="375" y1="120" y2="120"></line>
</g>
<!-- Compass / Inclinometer Needle pointing to +4.8 degrees -->
<g filter="url(#needle-shadow)" transform="rotate(4.8, 190, 120)">
<!-- Needle Pointer Body -->
<polygon fill="#FFFFFF" points="187.5,120 192.5,120 191.5,36 188.5,36"></polygon>
<!-- Needle Arrow Tip -->
<polygon fill="#FFFFFF" points="190,26 195,40 185,40"></polygon>
<!-- Needle Tail -->
<line stroke="#FFFFFF" stroke-linecap="round" stroke-width="3" x1="190" x2="190" y1="120" y2="132"></line>
</g>
<!-- Center Pivot Hub (Double concentric ring) -->
<circle cx="190" cy="120" fill="#0B0F19" r="8" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="190" cy="120" fill="#00E676" r="3"></circle>
</svg>
<!-- Port / Starboard Directional Labels under the dial -->
<div class="w-full flex justify-between px-10 text-[11px] font-mono tracking-widest text-telemetry-textMuted uppercase mt-1">
<span>BÂBORD</span>
<span>TRIBORD</span>
</div>
</div>
<!-- Center Bottom: High-contrast Angle Readout -->
<div class="w-full flex items-baseline justify-between border-t border-telemetry-border/70 pt-2 pb-1" data-purpose="current-heel-readout">
<div class="flex items-baseline gap-1">
<span class="text-[44px] leading-none font-mono font-black text-[#00E676] glow-volt tracking-tight">+4.8°</span>
</div>
<div class="text-[18px] font-black tracking-widest text-white uppercase font-sans">
            TRIBORD
          </div>
</div>
</div>
<!-- END: CenterInclinometerColumn -->
<!-- ========================================== -->
<!-- COLUMN 3: TELEMETRY & ACTIONS (RIGHT)      -->
<!-- ========================================== -->
<!-- BEGIN: RightStatusColumn -->
<div class="flex flex-col h-full bg-[#0A0E17]/80 p-5 justify-between" data-purpose="telemetry-actions-column">
<!-- Top Status Telemetry Indicators -->
<div class="flex flex-col gap-3.5" data-purpose="sensor-telemetry-status">
<!-- GPS and IMU active indicators -->
<div class="flex items-center justify-between font-mono text-[12px] font-semibold text-white px-1">
<div class="flex items-center gap-2">
<span class="inline-block w-2.5 h-2.5 rounded-full bg-[#00E676] glow-volt"></span>
<span>GPS</span>
</div>
<div class="flex items-center gap-2">
<span class="inline-block w-2.5 h-2.5 rounded-full bg-[#00E676] glow-volt"></span>
<span>IMU</span>
</div>
</div>
<!-- Network 4G status row -->
<div class="flex items-center justify-between font-mono text-[13px] text-telemetry-textDim px-1">
<span class="font-bold text-white tracking-wide">4G</span>
<!-- Signal strength bars -->
<div class="flex items-end gap-1 h-3.5">
<span class="w-[3px] h-1.5 bg-[#00E676] rounded-xs"></span>
<span class="w-[3px] h-2.5 bg-[#00E676] rounded-xs"></span>
<span class="w-[3px] h-3 bg-[#00E676] rounded-xs"></span>
<span class="w-[3px] h-3.5 bg-[#00E676] rounded-xs"></span>
</div>
</div>
<!-- Battery Level status row -->
<div class="flex items-center justify-between font-mono text-[13px] text-telemetry-textDim px-1">
<span class="font-bold text-white tracking-wide">60%</span>
<!-- Battery Icon representation -->
<div class="flex items-center">
<div class="w-6 h-3 rounded-[2px] border border-telemetry-borderLight p-[1.5px] flex items-center">
<div class="h-full bg-white rounded-[1px] w-[60%]"></div>
</div>
<div class="w-[2px] h-1.5 bg-telemetry-borderLight rounded-r-xs"></div>
</div>
</div>
</div>
<!-- Middle card: Estimated Split metric -->
<div class="w-full bg-[#131B26] border border-telemetry-border rounded-md px-3.5 py-2.5 flex flex-col justify-center shadow-inner" data-purpose="estimated-split-card">
<div class="text-[10px] font-mono tracking-wider text-telemetry-textMuted uppercase mb-0.5">
            SPLIT ESTIMÉ
          </div>
<div class="flex items-baseline justify-between">
<span class="text-[23px] font-bold text-white tracking-tight font-mono">2:08.2</span>
<span class="text-[11px] font-semibold text-telemetry-textMuted font-mono">/500m</span>
</div>
</div>
<!-- Bottom Emergency Stop Button -->
<div class="w-full pt-1" data-purpose="action-emergency-stop">
<button class="w-full h-[52px] bg-[#16202E] hover:bg-[#1E293B] active:bg-[#0F172A] border border-[#334155] rounded flex items-center justify-center text-white font-black tracking-[0.2em] text-[15px] uppercase transition-colors shadow-lg active:scale-[0.98]" type="button">
            STOP
          </button>
</div>
</div>
<!-- END: RightStatusColumn -->
</section>
<!-- END: MainInstrumentBody -->
</main>
<!-- END: CockpitDisplayContainer -->
</body></html>
