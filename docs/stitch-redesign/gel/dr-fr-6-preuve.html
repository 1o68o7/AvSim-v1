<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataR0w // DR-FR-6 Preuve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            oled: "#0A0A0A",
            surface: "#111418",
            "surface-subtle": "#161B22",
            hairline: "#2A2F36",
            volt: "#D6FF3C",
            starboard: "#46C275",
            port: "#E05353",
            muted: "#8C96A5",
          },
          fontFamily: {
            mono: ["'JetBrains Mono'", "monospace"],
            sans: ["'Inter'", "sans-serif"],
          }
        }
      }
    };
  </script>
  <style>
    .tabular-numbers {
      font-variant-numeric: tabular-nums;
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      white-space: nowrap;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#050608] text-[#F4F6F8] antialiased min-h-screen flex items-center justify-center p-0 selection:bg-volt selection:text-oled">
  <!-- Mobile target frame strictly 390x844 -->
  <main class="w-full max-w-[390px] min-h-[844px] h-[844px] flex flex-col justify-between bg-oled px-5 py-6 relative overflow-hidden border border-hairline/60">
    
    <!-- Nautical grid matrix subtle overlay -->
    <div class="absolute inset-0 pointer-events-none opacity-[0.035]" style="background-size: 24px 24px; background-image: linear-gradient(to right, #F4F6F8 1px, transparent 1px), linear-gradient(to bottom, #F4F6F8 1px, transparent 1px);"></div>

    <!-- Header / App bar -->
    <header class="relative z-10 flex items-center justify-between pt-1">
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 text-volt">
          <svg fill="currentColor" height="15" viewBox="0 0 256 256" width="15" xmlns="http://www.w3.org/2000/svg">
            <path d="M235.33,116.72,139.28,20.66a16,16,0,0,0-22.56,0l-96,96.06a16,16,0,0,0,0,22.56l96.05,96.06h0a16,16,0,0,0,22.56,0l96.05-96.06a16,16,0,0,0,0-22.56ZM128,224h0L32,128,128,32,224,128Z"></path>
          </svg>
          <span class="font-mono text-xs font-bold tracking-tight text-[#F4F6F8]">DataR0w</span>
        </div>
        <span class="font-mono text-[9px] uppercase tracking-wider text-muted px-1.5 py-0.5 rounded bg-surface border border-hairline">
          DR-FR-6
        </span>
      </div>

      <div class="flex items-center gap-2">
        <h1 class="font-sans text-[15px] font-semibold text-[#F4F6F8] tracking-tight">
          Preuve
        </h1>
        <button type="button" aria-label="Fermer" class="size-8 rounded-md bg-surface border border-hairline flex items-center justify-center text-muted hover:text-[#F4F6F8] hover:border-muted/40 transition-colors">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      </div>
    </header>

    <!-- Main Content Area: Centered Distance + Hero Time + Chips -->
    <div class="relative z-10 flex flex-col items-center justify-center flex-1 py-4">
      
      <!-- Segment Distance Label -->
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded bg-surface border border-hairline mb-4">
        <span class="size-1.5 rounded-full bg-volt"></span>
        <span class="font-mono text-xs font-bold uppercase tracking-wider text-[#F4F6F8]">
          2 000 m
        </span>
        <span class="font-mono text-[10px] text-muted tracking-tight border-l border-hairline pl-2">
          OFFICIEL
        </span>
      </div>

      <!-- Hero Time Display -->
      <div class="flex flex-col items-center">
        <div class="font-mono text-[76px] leading-none font-extrabold tracking-tight text-[#F4F6F8] tabular-numbers">
          7:44
        </div>
        
        <!-- Volt Chip: PB 2 000 m -->
        <div class="mt-4 inline-flex items-center gap-1.5 px-3 py-1 rounded bg-volt text-oled font-mono text-[11px] font-bold tracking-wider uppercase">
          <span class="material-symbols-outlined text-[14px]">military_tech</span>
          <span>PB 2 000 m</span>
        </div>

        <!-- Starboard Delta Line: -4 s vs cible -->
        <div class="mt-3 flex items-center gap-1.5 text-starboard font-mono text-sm font-semibold tracking-tight tabular-numbers">
          <span class="material-symbols-outlined text-[16px]">trending_down</span>
          <span>−4 s vs cible</span>
        </div>
      </div>

      <!-- KPI Rows Table Container (No shadows, hairline border) -->
      <section class="w-full mt-7 bg-surface rounded-xl border border-hairline p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between border-b border-hairline/60 pb-2">
          <span class="font-mono text-[10px] uppercase font-bold tracking-wider text-muted">
            MÉTRIQUES SÉANCE 2K
          </span>
          <span class="font-mono text-[10px] text-muted flex items-center gap-1">
            <span class="size-1.5 rounded-full bg-starboard"></span>
            SYNC VALIDÉE
          </span>
        </div>

        <div class="flex flex-col divide-y divide-hairline/50">
          
          <!-- Row 1: Split moyen -->
          <div class="py-2.5 flex items-center justify-between first:pt-1">
            <span class="font-sans text-[13px] text-muted">
              Split moyen
            </span>
            <div class="font-mono text-[15px] font-bold text-[#F4F6F8] tabular-numbers tracking-tight">
              1:56 <span class="text-xs font-medium text-muted">/500 m</span>
            </div>
          </div>

          <!-- Row 2: Cadence moy. -->
          <div class="py-2.5 flex items-center justify-between">
            <span class="font-sans text-[13px] text-muted">
              Cadence moy.
            </span>
            <div class="font-mono text-[15px] font-bold text-[#F4F6F8] tabular-numbers tracking-tight">
              27 <span class="text-xs font-medium text-muted">spm</span>
            </div>
          </div>

          <!-- Row 3: Watts moy. -->
          <div class="py-2.5 flex items-center justify-between">
            <span class="font-sans text-[13px] text-muted">
              Watts moy.
            </span>
            <div class="font-mono text-[15px] font-bold text-[#F4F6F8] tabular-numbers tracking-tight">
              238 <span class="text-xs font-medium text-muted">W</span>
            </div>
          </div>

          <!-- Row 4: Drag factor -->
          <div class="py-2.5 flex items-center justify-between last:pb-1">
            <span class="font-sans text-[13px] text-muted">
              Drag factor
            </span>
            <div class="font-mono text-[15px] font-bold text-[#F4F6F8] tabular-numbers tracking-tight">
              115
            </div>
          </div>

        </div>
      </section>

      <!-- Context Footnote / Standard telemetry confirmation -->
      <div class="mt-3 flex items-center justify-center gap-2 text-muted/60">
        <span class="font-mono text-[9px] tracking-tight uppercase">
          Flux Concept2 PM5 BLE · Épreuve standardisée 2 000 m
        </span>
      </div>

    </div>

    <!-- Bottom Action CTA (Volt #D6FF3C, Height 52px, No shadows) -->
    <footer class="relative z-10 pt-2 pb-1 flex flex-col items-center w-full">
      <button type="button" class="w-full h-[52px] rounded-xl bg-volt text-oled font-sans text-[15px] font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform cursor-pointer">
        <span>Poser la suivante</span>
        <span class="material-symbols-outlined text-[19px]">arrow_forward</span>
      </button>
    </footer>

  </main>
</body>
</html>
