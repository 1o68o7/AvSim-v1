# JDK 24+ : sans ce flag, Gradle native-platform émet
#   WARNING: A restricted method in java.lang.System has been called
#   Use --enable-native-access=ALL-UNNAMED …
# Appliqué au daemon Gradle + daemon Kotlin (Android Studio lit ce fichier).
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx2G --enable-native-access=ALL-UNNAMED

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
